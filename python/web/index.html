<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Voice Assistant</title>
<script src="livekit-client.js"></script>
<script>
  if (!window.LivekitClient) {
    document.write('<script src="https://unpkg.com/livekit-client@2.23.0/dist/livekit-client.umd.js"><\/script>');
  }
  if (!window.LivekitClient) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"><\/script>');
  }
</script>
<style>
  :root {
    --bg: #0a0c12; --fg: #e8eaf2; --dim: #8b93a7;
    --accent: #6ea8ff; --accent2: #9b7bff; --ok: #4ade80; --warn: #fbbf24;
    --panel: rgba(16, 19, 28, 0.92); --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 30%, #121625 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none;
  }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
  canvas { display: block; }

  .corner { position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 30; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--dim); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .18s ease; backdrop-filter: blur(8px);
  }
  .iconbtn:hover { color: var(--fg); border-color: var(--accent); transform: translateY(-1px); }
  .iconbtn.active { color: var(--accent); border-color: var(--accent); }

  #center {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 5; pointer-events: none; width: max-content;
  }
  #state {
    font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); transition: color .3s;
  }
  #state.speaking { color: var(--accent); }
  #hint { margin-top: 8px; font-size: 12.5px; color: var(--dim); opacity: .7; }

  #callbtn {
    position: fixed; left: 50%; bottom: 34px;
    transform: translateX(-50%);
    width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(160deg, #34d399, #0ea5e9 130%); color: #04291a;
    font-size: 30px; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 36px rgba(52,211,153,.35); transition: all .2s ease;
  }
  #callbtn:hover { transform: translateX(-50%) scale(1.06); }
  #callbtn.live {
    background: linear-gradient(160deg, #f87171, #b91c1c 130%); color: #fff;
    box-shadow: 0 12px 36px rgba(239,68,68,.4);
  }
  #callbtn:disabled { opacity: .55; cursor: wait; }

  #micdock {
    position: fixed; left: 50%; bottom: 128px;
    transform: translateX(-50%);
    width: min(480px, 60vw); z-index: 10; text-align: center;
  }
  #miccanvas { width: 100%; height: 40px; opacity: .9; }
  #miclabel { font-size: 10px; letter-spacing: .2em; color: var(--dim); margin-top: 2px; opacity: .55; }

  #side {
    position: fixed; left: 0; top: 0; bottom: 0; width: min(340px, 42vw);
    display: flex; flex-direction: column;
    background: rgba(13,16,24,0.9); border-right: 1px solid var(--line);
    z-index: 25; overflow: hidden; backdrop-filter: blur(14px);
    transition: transform .24s ease;
  }
  #side.hidden { transform: translateX(-102%); }
  #sidehead {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  #sidehead .clearlog { background: none; border: none; color: var(--dim); font-size: 11px;
    cursor: pointer; letter-spacing: .06em; }
  #sidehead .clearlog:hover { color: var(--warn); }
  #transcript { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 14px; font-size: 14px;
    line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.you { align-self: flex-end; background: rgba(110,168,255,.16); border: 1px solid rgba(110,168,255,.25); }
  .msg.bot { align-self: flex-start; background: rgba(155,123,255,.14); border: 1px solid rgba(155,123,255,.24); }
  .msg.pending { opacity: .65; }
  #chatform { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #chatinput {
    flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 10px; color: var(--fg); padding: 10px 12px; font-size: 14px; outline: none;
  }
  #chatinput:focus { border-color: var(--accent); }
  #sendbtn {
    background: var(--accent); border: none; color: #08101f; font-weight: 600;
    border-radius: 10px; padding: 0 16px; cursor: pointer; font-size: 14px;
  }
  @media (max-width: 860px) {
    #side { width: min(86vw, 340px); }
    #micdock { width: min(420px, 80vw); }
    body.panel-open #status { left: 14px; }
  }

  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    z-index: 60; background: rgba(3,5,10,.55); }
  .modal.open { display: flex; }
  .modalbox { width: min(96vw, 1060px); height: min(92vh, 780px);
    background: #10131c; border: 1px solid var(--line); border-radius: 18px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .modalhead { display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-bottom: 1px solid var(--line); }
  .modalhead h2 { font-size: 16px; font-weight: 600; letter-spacing: .03em; }
  .tabbar { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .tab { background: none; border: 1px solid transparent; color: var(--dim);
    font-size: 13px; padding: 7px 14px; border-radius: 10px; cursor: pointer; }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-color: var(--line); background: rgba(255,255,255,.05); }
  .modalbody { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .tabpage { display: none; max-width: 780px; }
  .tabpage.active { display: block; }
  .closebtn { background: none; border: none; color: var(--dim); font-size: 24px; cursor: pointer; }
  .closebtn:hover { color: var(--fg); }

  .sect { margin: 20px 0 10px; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent);
    border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .tabpage .sect:first-child { margin-top: 0; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 5px; }
  .field input[type=text], .field input[type=password], .field select {
    width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 10px; color: var(--fg); padding: 9px 11px; font-size: 14px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .rangeval { float: right; color: var(--accent); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .savebar { padding: 14px 18px; border-top: 1px solid var(--line); }
  #savebtn {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--accent);
    background: linear-gradient(135deg, rgba(110,168,255,.2), rgba(155,123,255,.2));
    color: var(--fg); font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #savebtn:hover { box-shadow: 0 0 24px rgba(110,168,255,.3); }
  #savemsg { text-align: center; font-size: 12.5px; margin-top: 8px; min-height: 16px; color: var(--ok); }

  .sess { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
  .sess:hover { border-color: var(--accent); }
  .sess .stitle { font-size: 14px; font-weight: 600; }
  .sess .sdate { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .sess .sprev { font-size: 12.5px; color: var(--dim); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .histmsg { margin-bottom: 12px; }
  .histmsg .hm-who { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .histmsg.bot .hm-who { color: var(--accent2); }
  .histmsg .hm-ts { color: var(--dim); font-size: 10.5px; margin-left: 6px; }
  .histmsg .hm-text { font-size: 14px; margin-top: 3px; line-height: 1.5; }
  .backlink { color: var(--accent); font-size: 13px; cursor: pointer; margin-bottom: 12px; display: inline-block; }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; font-size: 13.5px; }

  #toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 18px; font-size: 13px; z-index: 50; opacity: 0; transition: opacity .3s;
    pointer-events: none; max-width: min(560px, 90vw); text-align: center; }
  #toast.show { opacity: 1; }
  #status {
    position: fixed; top: 14px; left: 14px; z-index: 40;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px 9px; backdrop-filter: blur(10px);
    transition: left .24s ease;
  }
  body.panel-open #status { left: calc(min(340px, 42vw) + 26px); }
  #strow { display: flex; align-items: center; gap: 9px; }
  #stdot {
    width: 11px; height: 11px; border-radius: 50%; background: #64748b; flex: none;
    transition: background .3s ease;
  }
  #stdot.ok { background: var(--ok); }
  #stdot.warn { background: var(--warn); }
  #stdot.err { background: #f87171; }
  #stdot.listen { background: #22d3ee; }
  #stdot.speak { background: var(--accent2); }
  #stdot.pulse { animation: dotpulse 1.3s ease-in-out infinite; }
  @keyframes dotpulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: .7; } }
  #stword {
    font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    white-space: nowrap;
  }
  #stmic { margin-left: auto; padding-left: 14px; font-size: 10.5px; color: var(--dim); letter-spacing: .06em; white-space: nowrap; }
  #stchips {
    margin-top: 7px; font-size: 10.5px; color: var(--dim); letter-spacing: .02em;
    max-width: 300px; line-height: 1.7;
  }
  #stchips b.ok { color: var(--ok); font-weight: 500; }
  #stchips b.bad2 { color: var(--warn); font-weight: 500; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="center">
    <div id="state">ready</div>
    <div id="hint">press play, then just talk</div>
  </div>

  <button id="callbtn" title="Start the call"><svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>

  <div id="micdock">
    <canvas id="miccanvas"></canvas>
    <div id="miclabel">MIC</div>
  </div>

  <div id="side" class="hidden">
    <div id="sidehead"><span>Conversation</span><button class="clearlog" id="clearlog" type="button">clear</button></div>
    <div id="transcript"></div>
    <form id="chatform">
      <input id="chatinput" type="text" placeholder="Type a message (optional)..." autocomplete="off">
      <button id="sendbtn" type="submit">Send</button>
    </form>
  </div>

  <div class="corner">
    <button class="iconbtn" id="chaticon" title="Show / hide conversation">&#128172;</button>
    <button class="iconbtn" id="histbtn" title="Chat history">&#128337;</button>
    <button class="iconbtn" id="gearbtn" title="Settings">&#9881;</button>
  </div>

  <div class="modal" id="settingsheet">
    <div class="modalbox">
      <div class="modalhead">
        <h2>Settings</h2>
        <div class="tabbar">
          <button class="tab active" data-tab="tabconn" type="button">Connection</button>
          <button class="tab" data-tab="tabspeech" type="button">Speech</button>
          <button class="tab" data-tab="tabbehav" type="button">Behavior</button>
          <button class="tab" data-tab="tabadv" type="button">Advanced</button>
        </div>
        <button class="closebtn" id="closegear">&times;</button>
      </div>
      <div class="modalbody">
        <div class="tabpage active" id="tabconn">
          <div class="sect">LiveKit</div>
          <div class="field"><label>LiveKit URL</label><input type="text" id="cfg-LIVEKIT_URL" placeholder="ws://127.0.0.1:7880"></div>
          <div class="grid2">
            <div class="field"><label>LiveKit API key</label><input type="text" id="cfg-LIVEKIT_API_KEY"></div>
            <div class="field"><label>LiveKit API secret</label><input type="password" id="cfg-LIVEKIT_API_SECRET"></div>
          </div>
          <div class="sect">Microphone (browser capture)</div>
          <div class="field"><label>Input device (applies to the next call)</label>
            <select id="micdevice"><option value="">System default</option></select>
          </div>
          <div class="sect">Language model</div>
          <div class="field"><label>textgen API URL</label><input type="text" id="cfg-TEXTGEN_BASE_URL"></div>
          <div class="grid2">
            <div class="field"><label>textgen API key</label><input type="password" id="cfg-TEXTGEN_API_KEY"></div>
            <div class="field"><label>Model name</label><input type="text" id="cfg-TEXTGEN_MODEL"></div>
          </div>
          <div class="field"><label>Token streaming</label>
            <select id="cfg-LLM_STREAMING"><option value="0">Full reply first (stable)</option><option value="1">Stream tokens (live text)</option></select>
          </div>
        </div>

        <div class="tabpage" id="tabspeech">
          <div class="sect">Speech-to-text</div>
          <div class="field"><label>Whisper model</label><select id="cfg-WHISPER_MODEL"></select></div>
          <div class="grid2">
            <div class="field"><label>Device</label>
              <select id="cfg-WHISPER_DEVICE"><option value="auto">Auto</option><option value="cuda">GPU (CUDA)</option><option value="cpu">CPU</option></select>
            </div>
            <div class="field"><label>Compute</label>
              <select id="cfg-WHISPER_COMPUTE"><option value="auto">Auto</option><option value="float16">float16</option><option value="int8">int8</option></select>
            </div>
          </div>
          <div class="grid2">
            <div class="field"><label>Language (auto = detect)</label>
              <select id="cfg-WHISPER_LANGUAGE">
                <option value="auto">auto</option><option value="en">en</option><option value="id">id</option>
                <option value="ja">ja</option><option value="zh">zh</option><option value="ko">ko</option>
                <option value="es">es</option><option value="fr">fr</option><option value="de">de</option>
                <option value="pt">pt</option><option value="ru">ru</option><option value="ar">ar</option>
                <option value="hi">hi</option>
              </select>
            </div>
            <div class="field"><label>Beam width</label>
              <select id="cfg-WHISPER_BEAM"><option value="1">1 (fast)</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 (slow)</option></select>
            </div>
          </div>
          <div class="grid3">
            <div class="field"><label>Temperature</label><input type="text" id="cfg-WHISPER_TEMPERATURE" inputmode="decimal" placeholder="0.0"></div>
            <div class="field"><label>Min logprob</label><input type="text" id="cfg-WHISPER_MIN_LOGPROB" inputmode="decimal" placeholder="-1.0"></div>
            <div class="field"><label>Max compratio</label><input type="text" id="cfg-WHISPER_MAX_COMPRATIO" inputmode="decimal" placeholder="2.4"></div>
          </div>
          <div class="field"><label>VAD filter (skips silence)</label>
            <select id="cfg-WHISPER_VAD_FILTER"><option value="0">Off</option><option value="1">On</option></select>
          </div>
          <div class="sect">Text-to-speech</div>
          <div class="field"><label>Piper voice</label><select id="cfg-TTS_VOICE"></select></div>
          <div class="field"><label>TTS speed <span class="rangeval" id="val-TTS_SPEED"></span></label>
            <input type="range" id="cfg-TTS_SPEED" min="0.7" max="1.6" step="0.05">
          </div>
        </div>

        <div class="tabpage" id="tabbehav">
          <div class="sect">Turn taking</div>
          <div class="field"><label>End-of-sentence pause (s) <span class="rangeval" id="val-ENDPOINTING_DELAY"></span></label>
            <input type="range" id="cfg-ENDPOINTING_DELAY" min="0.3" max="2" step="0.05">
          </div>
          <div class="grid2">
            <div class="field"><label>Min silence (s) <span class="rangeval" id="val-VAD_MIN_SILENCE"></span></label>
              <input type="range" id="cfg-VAD_MIN_SILENCE" min="0.2" max="1.5" step="0.05">
            </div>
            <div class="field"><label>VAD threshold <span class="rangeval" id="val-VAD_ACTIVATION_THRESHOLD"></span></label>
              <input type="range" id="cfg-VAD_ACTIVATION_THRESHOLD" min="0.2" max="0.8" step="0.05">
            </div>
          </div>
          <div class="sect">Echo guard</div>
          <div class="field"><label>Echo guard</label>
            <select id="cfg-ECHO_GUARD"><option value="1">On (drops mic echo of the assistant)</option><option value="0">Off</option></select>
          </div>
          <div class="field"><label>Echo guard tail (s) <span class="rangeval" id="val-ECHO_GUARD_TAIL"></span></label>
            <input type="range" id="cfg-ECHO_GUARD_TAIL" min="0" max="3" step="0.1">
          </div>
        </div>

        <div class="tabpage" id="tabadv">
          <div class="sect">Advanced</div>
          <div class="field"><label>Log level (needs agent restart)</label>
            <select id="cfg-LOG_LEVEL"><option value="DEBUG">DEBUG</option><option value="INFO">INFO</option><option value="WARNING">WARNING</option><option value="ERROR">ERROR</option></select>
          </div>
        </div>
      </div>
      <div class="savebar">
        <button id="savebtn">Save changes</button>
        <div id="savemsg"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="histsheet">
    <div class="modalbox">
      <div class="modalhead"><h2>Chat history</h2><button class="closebtn" id="closehist">&times;</button></div>
      <div class="modalbody" id="histbody"></div>
    </div>
  </div>

  <div id="status">
    <div id="strow">
      <span id="stdot"></span>
      <span id="stword">starting</span>
      <span id="stmic"></span>
    </div>
    <div id="stchips">checking services...</div>
  </div>
  <div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LK = window.LivekitClient;
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>';
let room = null, live = false, msgCounter = 0;
let bubbles = {};
let agentCtx = null, micCtx = null, agentAn = null, micAn = null;
let agentData = null, micData = null, rafId = 0;
let micStream = null, stateTimer = 0;
let lastEcho = { text: "", at: 0 };
let micPubOk = false, micSilenceSince = 0, micWarned = false;
let srvErr = false, srvDegraded = false, stCache = "\t\t\t";

function toast(text, ms) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), ms || 2600);
}

function setState(text, cls) {
  $("state").textContent = text;
  $("state").className = cls || "";
}

function pulseState(text) {
  if (!live) return;
  setState(text, text === "speaking" ? "speaking" : "");
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => { if (live) setState("listening"); }, 3000);
}

function micErrorText(e) {
  const n = (e && e.name) || "";
  if (n === "NotAllowedError" || n === "SecurityError") return "microphone permission denied - allow mic in the browser address bar";
  if (n === "NotFoundError" || n === "DevicesNotFoundError") return "no microphone found";
  if (n === "NotReadableError" || n === "TrackStartError") return "microphone is busy (another app is using it)";
  return "microphone error: " + ((e && e.message) || n || "unknown");
}

function chip(name, ok, val) {
  return name + " <b class=\"" + (ok ? "ok" : "bad2") + "\">" + val + "</b>";
}

async function checkHealth() {
  try {
    const r = await fetch("/health");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const h = await r.json();
    const lk = !!(h.livekit && h.livekit.status === "up");
    const tg = !!(h.textgen && String(h.textgen.status || "").startsWith("up"));
    const gpu = String(h.gpu || "").startsWith("YES");
    const sttN = h.models ? Number(h.models.stt) || 0 : 0;
    const ttsN = h.models ? Number(h.models.tts) || 0 : 0;
    const lib = !!(h.lib_file && h.lib_file.exists);
    const ag = !!(h.children && h.children.agent === "up");
    const el = $("stchips");
    el.innerHTML = chip("livekit", lk, lk ? "up" : "down") + " &middot; " +
      chip("textgen", tg, tg ? "up" : "down") + " &middot; " +
      chip("gpu", gpu, gpu ? "yes" : "no") + " &middot; " +
      chip("stt", sttN > 0, sttN) + " &middot; " +
      chip("tts", ttsN > 0, ttsN) + " &middot; " +
      chip("agent", ag, ag ? "up" : "down") +
      (lib ? "" : " &middot; lib missing");
    srvErr = !lk || !ag;
    srvDegraded = !srvErr && !tg;
  } catch (e) {
    $("stchips").innerHTML = "server unreachable";
    srvErr = true;
    srvDegraded = false;
  }
}

async function precheck() {
  const fatal = [], warn = [];
  if (!window.LivekitClient) fatal.push("livekit-client.js failed to load - Ctrl+F5 or re-extract the kit");
  let h = null;
  try {
    const r = await fetch("/health");
    if (!r.ok) throw new Error("HTTP " + r.status);
    h = await r.json();
  } catch (e) {
    fatal.push("backend unreachable (" + e.message + ")");
  }
  if (h) {
    if (h.venv === false) fatal.push(".venv missing - run setup.bat");
    if (h.lib_file && !h.lib_file.exists) fatal.push("livekit-client.js missing on server - re-extract the kit");
    if (h.livekit && h.livekit.status !== "up") fatal.push("LiveKit server is down - restart start.bat");
    if (h.children && h.children.agent && h.children.agent !== "up") warn.push("agent worker: " + h.children.agent);
    if (h.textgen && !String(h.textgen.status || "").startsWith("up")) warn.push("textgen API is down - the bot cannot reply until it starts");
    if (h.models) {
      if (!Number(h.models.stt)) warn.push("no Whisper model downloaded yet - run setup.bat or check settings");
      if (!Number(h.models.tts)) warn.push("no Piper voice downloaded yet - run setup.bat or check settings");
    }
  }
  if (!fatal.length && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach((t) => t.stop());
    } catch (e) {
      fatal.push(micErrorText(e));
    }
  }
  return { fatal, warn };
}

function addBubble(who, text, id, final) {
  if (!text || !text.trim()) return null;
  if (who === "user" && final && id && !id.startsWith("loc")) {
    if (text === lastEcho.text && Date.now() - lastEcho.at < 8000) return null;
  }
  const key = id || ("m" + (++msgCounter));
  let div = bubbles[key];
  if (!div) {
    div = document.createElement("div");
    div.className = "msg " + (who === "user" ? "you" : "bot");
    $("transcript").appendChild(div);
    bubbles[key] = div;
  }
  div.textContent = text;
  div.classList.toggle("pending", !final);
  $("transcript").scrollTop = $("transcript").scrollHeight;
  if (final) pulseState(who === "bot" ? "speaking" : "thinking");
  return div;
}

function resetTranscript() {
  bubbles = {};
  $("transcript").innerHTML = "";
}

async function connect() {
  if (!window.LivekitClient) throw new Error("livekit-client.js missing");
  const r = await fetch("/token?identity=user-" + Math.random().toString(16).slice(2, 6));
  if (!r.ok) {
    let why = "HTTP " + r.status;
    try { const j = await r.json(); if (j.error) why = j.error; } catch (e) {}
    throw new Error("token request failed: " + why);
  }
  const d = await r.json();
  if (!d.url || !d.token) throw new Error(d.error || "bad token response");
  resetTranscript();
  const dev = (() => { try { return localStorage.getItem("micDeviceId") || ""; } catch (e) { return ""; } })();
  room = new LK.Room({
    adaptiveStream: false, dynacast: false,
    audioCaptureDefaults: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true,
      deviceId: dev ? { ideal: dev } : undefined,
    },
  });
  room.on(LK.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
    if (topic !== "transcript") return;
    try {
      const m = JSON.parse(new TextDecoder().decode(payload));
      if (m && typeof m.text === "string") addBubble(m.who, m.text, m.id, m.final !== false);
    } catch (e) {
      console.warn("bad transcript packet", e);
    }
  });
  room.on(LK.RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === "audio") {
      try {
        const el = track.attach();
        el.style.display = "none";
        document.body.appendChild(el);
      } catch (e) {
        console.warn("attach failed", e);
      }
      hookAgentAudio(track);
    }
  });
  room.on(LK.RoomEvent.MediaDevicesError, (e) => {
    toast(micErrorText(e), 4000);
  });
  room.on(LK.RoomEvent.Disconnected, () => {
    if (live) { live = false; setLiveUi(false); toast("Call ended"); }
  });
  try {
    await room.prepareConnection(d.url, d.token);
  } catch (e) {
    console.warn("prepareConnection skipped", e);
  }
  await room.connect(d.url, d.token);
  try {
    await room.localParticipant.setMicrophoneEnabled(true);
  } catch (e) {
    throw new Error(micErrorText(e));
  }
  const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
  if (!pub || !pub.track || !pub.track.mediaStreamTrack) {
    throw new Error("microphone track was not published - stop and start the call again");
  }
  micPubOk = true;
  micWarned = false;
  micSilenceSince = 0;
  try {
    micStream = new MediaStream([pub.track.mediaStreamTrack]);
    hookMicAudio(micStream);
  } catch (e) {
    console.warn("mic analyser failed", e);
  }
}

async function startCall() {
  $("callbtn").disabled = true;
  setState("checking");
  let pc;
  try {
    pc = await precheck();
  } catch (e) {
    pc = { fatal: [String(e && e.message || e)], warn: [] };
  }
  if (pc.fatal.length) {
    setState("blocked");
    toast("Cannot start: " + pc.fatal[0] + (pc.fatal.length > 1 ? " (+" + (pc.fatal.length - 1) + " more, see console)" : ""), 4200);
    console.warn("precheck fatal:", pc.fatal, "warnings:", pc.warn);
    $("callbtn").disabled = false;
    return;
  }
  pc.warn.forEach((w) => toast(w, 3600));
  setState("connecting");
  try {
    await connect();
    live = true;
    setLiveUi(true);
    setState("listening");
    toast("Connected - just talk (pause to hand over the turn)");
  } catch (e) {
    console.error(e);
    setState("ready");
    micPubOk = false;
    toast("Could not connect: " + (e && e.message ? e.message : e), 4000);
  }
  $("callbtn").disabled = false;
}

async function stopCall() {
  live = false;
  micPubOk = false;
  micWarned = false;
  clearTimeout(stateTimer);
  try { if (room) await room.disconnect(); } catch (e) { console.warn("disconnect", e); }
  cleanupAudio();
  setLiveUi(false);
  setState("ready");
}

function getCtx(which) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (which === "agent") {
    agentCtx = agentCtx || new AC();
    if (agentCtx.state === "suspended") agentCtx.resume().catch(() => {});
    return agentCtx;
  }
  micCtx = micCtx || new AC();
  if (micCtx.state === "suspended") micCtx.resume().catch(() => {});
  return micCtx;
}

function hookAgentAudio(track) {
  try {
    if (!track || !track.mediaStreamTrack) throw new Error("no media stream track");
    const ctx = getCtx("agent");
    if (!ctx) throw new Error("WebAudio unavailable");
    const src = ctx.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
    agentAn = ctx.createAnalyser();
    agentAn.fftSize = 128;
    src.connect(agentAn);
    agentData = new Uint8Array(agentAn.frequencyBinCount);
  } catch (e) {
    console.warn("agent analyser failed", e);
  }
}

function hookMicAudio(stream) {
  try {
    const ctx = getCtx("mic");
    if (!ctx) throw new Error("WebAudio unavailable");
    const src = ctx.createMediaStreamSource(stream);
    micAn = ctx.createAnalyser();
    micAn.fftSize = 128;
    src.connect(micAn);
    micData = new Uint8Array(micAn.frequencyBinCount);
  } catch (e) {
    console.warn("mic analyser failed", e);
  }
}

function cleanupAudio() {
  try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
  micStream = null; micAn = null; agentAn = null; agentData = null; micData = null;
  clearCanvas($("stage")); clearCanvas($("miccanvas"));
}

function clearCanvas(c) {
  try {
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
  } catch (e) {}
}

function micLevel() {
  if (!micAn || !micData) return 0;
  let m = 0;
  for (let i = 0; i < micData.length; i++) { if (micData[i] > m) m = micData[i]; }
  return m / 255;
}

function agentLevel() {
  if (!agentAn || !agentData) return 0;
  let sum = 0;
  for (let i = 0; i < agentData.length; i++) sum += agentData[i];
  return sum / (agentData.length * 255);
}

function renderStatus(ml) {
  let cls = "", word = "ready", pulse = false, micTxt = "";
  if (!live) {
    if (srvErr) { cls = "err"; word = "server down"; }
    else if (srvDegraded) { cls = "warn"; word = "degraded"; pulse = true; }
    else { cls = "ok"; word = "ready"; }
  } else {
    let muted = false;
    try {
      const p = room && room.localParticipant
        ? room.localParticipant.getTrackPublication(LK.Track.Source.Microphone) : null;
      muted = !!(p && p.isMuted);
    } catch (e) {}
    micTxt = muted ? "mic muted" : (micPubOk ? (ml > 0.06 ? "mic active" : "mic on") : "mic off");
    const ag = agentLevel();
    if (ag > 0.07) { cls = "speak"; word = "assistant speaking"; pulse = true; }
    else if (ml > 0.09) { cls = "listen"; word = "listening"; pulse = true; }
    else { cls = "ok"; word = "live - listening"; }
  }
  const key = cls + "|" + (pulse ? 1 : 0) + "|" + word + "|" + micTxt;
  if (key === stCache) return;
  stCache = key;
  $("stdot").className = cls + (pulse ? " pulse" : "");
  $("stword").textContent = word;
  $("stmic").textContent = micTxt;
}

async function fillMicDevices() {
  const sel = $("micdevice");
  if (!sel || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cur = (() => { try { return localStorage.getItem("micDeviceId") || ""; } catch (e) { return ""; } })();
    sel.innerHTML = '<option value="">System default</option>';
    let found = false;
    devs.forEach((d) => {
      if (d.kind !== "audioinput") return;
      const label = d.label || ("microphone " + sel.options.length);
      addOpt(sel, d.deviceId, label);
      if (d.deviceId && d.deviceId === cur) found = true;
    });
    if (found) sel.value = cur;
  } catch (e) {
    console.warn("enumerateDevices failed", e);
  }
}

$("micdevice").addEventListener("change", () => {
  try { localStorage.setItem("micDeviceId", $("micdevice").value || ""); } catch (e) {}
  toast("Microphone saved - applies to the next call");
});

const stage = $("stage"), sctx = stage.getContext("2d");
const micc = $("miccanvas"), mctx = micc.getContext("2d");

function fitCanvas() {
  try {
    const r = stage.getBoundingClientRect();
    stage.width = Math.max(1, Math.floor(r.width * devicePixelRatio));
    stage.height = Math.max(1, Math.floor(r.height * devicePixelRatio));
    micc.width = Math.max(1, Math.floor(micc.clientWidth * devicePixelRatio));
    micc.height = Math.max(1, Math.floor(micc.clientHeight * devicePixelRatio));
  } catch (e) {
    console.warn("fitCanvas failed", e);
  }
}
addEventListener("resize", () => { try { fitCanvas(); applySide(); } catch (e) {} });
addEventListener("orientationchange", () => setTimeout(() => { fitCanvas(); applySide(); }, 250));
fitCanvas();
applySide();

let phase = 0;
function draw() {
  phase += 0.015;
  try {
    if (agentAn && agentData) agentAn.getByteFrequencyData(agentData);
    if (micAn && micData) micAn.getByteFrequencyData(micData);
    const ml = micLevel();
    if (live && micPubOk && !micWarned) {
      if (ml > 0.06) {
        micSilenceSince = 0;
      } else if (!micSilenceSince) {
        micSilenceSince = Date.now();
      } else if (Date.now() - micSilenceSince > 6000) {
        micWarned = true;
        toast("Mic is connected but silent - pick another input device in Settings, or check Windows microphone privacy settings", 5200);
      }
    }
    renderStatus(ml);
    drawOrb();
    drawMic();
  } catch (e) {
    console.warn("draw failed", e);
  }
  rafId = requestAnimationFrame(draw);
}

function drawOrb() {
  const w = stage.width, h = stage.height;
  sctx.clearRect(0, 0, w, h);
  const cx = w / 2;
  const cy = h / 2;
  const base = Math.min(w, h) * 0.13;
  const level = agentLevel();
  const idle = live ? 0.12 : 0.05;
  const breath = 1 + Math.sin(phase * 1.6) * (live ? 0.05 : 0.03);
  const r = base * (0.9 + level * 1.6) * breath;

  const glow = sctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r * 2.6);
  glow.addColorStop(0, "rgba(110,168,255," + (0.16 + level * 0.5) + ")");
  glow.addColorStop(1, "rgba(110,168,255,0)");
  sctx.fillStyle = glow;
  sctx.fillRect(cx - r * 3, cy - r * 3, r * 6, r * 6);

  const bars = 72;
  for (let i = 0; i < bars; i++) {
    const ang = (i / bars) * Math.PI * 2 + phase * 0.4;
    const v = agentData
      ? agentData[Math.floor(i / bars * agentData.length * 0.7)] / 255
      : 0;
    const amp = idle + v * 1.1;
    const len = r * (0.35 + amp * 0.85);
    const x1 = cx + Math.cos(ang) * r * 0.72;
    const y1 = cy + Math.sin(ang) * r * 0.72;
    const x2 = cx + Math.cos(ang) * (r * 0.72 + len);
    const y2 = cy + Math.sin(ang) * (r * 0.72 + len);
    const hue = 215 + Math.sin(i * 0.35 + phase) * 28;
    sctx.strokeStyle = "hsla(" + hue + ", 90%, " + (62 + v * 22) + "%, " + (0.35 + v * 0.65) + ")";
    sctx.lineWidth = 2.4 * devicePixelRatio;
    sctx.lineCap = "round";
    sctx.beginPath();
    sctx.moveTo(x1, y1);
    sctx.lineTo(x2, y2);
    sctx.stroke();
  }
  sctx.beginPath();
  sctx.arc(cx, cy, r * 0.66, 0, Math.PI * 2);
  sctx.fillStyle = "rgba(16,22,40,0.9)";
  sctx.fill();
  sctx.strokeStyle = "rgba(140,180,255," + (0.3 + level * 0.6) + ")";
  sctx.lineWidth = 1.6 * devicePixelRatio;
  sctx.stroke();
}

function drawMic() {
  const w = micc.width, h = micc.height;
  mctx.clearRect(0, 0, w, h);
  const bars = 48, gap = 3 * devicePixelRatio;
  const bw = (w - gap * (bars - 1)) / bars;
  for (let i = 0; i < bars; i++) {
    const v = micData
      ? micData[Math.floor(i / bars * micData.length * 0.6)] / 255
      : 0;
    const bh = Math.max(2 * devicePixelRatio, v * h * 0.92);
    const x = i * (bw + gap);
    const y = (h - bh) / 2;
    mctx.fillStyle = "rgba(110,168,255," + (0.25 + v * 0.7) + ")";
    const rr = Math.min(bw / 2, 3 * devicePixelRatio);
    mctx.beginPath();
    if (mctx.roundRect) mctx.roundRect(x, y, bw, bh, rr);
    else mctx.rect(x, y, bw, bh);
    mctx.fill();
  }
}
draw();

function ensureOpt(sel, val) {
  if (!sel) return;
  const has = Array.from(sel.options).some((o) => o.value === val);
  if (!has && val) addOpt(sel, val, val);
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> HTTP " + r.status);
  return r.json();
}

async function loadConfigForm() {
  const [cfgR, sttR, ttsR] = await Promise.all([
    fetchJson("/api/config"),
    fetchJson("/api/models/stt"),
    fetchJson("/api/models/tts"),
  ]);
  const cfg = cfgR.config || {};
  for (const [k, el] of Object.entries(cfgEls())) {
    if (cfg[k] !== undefined && cfg[k] !== "") {
      if (el.tagName === "SELECT") ensureOpt(el, cfg[k]);
      el.value = cfg[k];
    }
    if (el.type === "range") updateRange(k);
  }
  const sel = $("cfg-WHISPER_MODEL");
  sel.innerHTML = "";
  (sttR.local_folders || []).forEach((m) => addOpt(sel, m.name, m.name + " (folder, " + m.size_mb + " MB)"));
  (sttR.presets || []).forEach((m) => addOpt(sel, m.name, m.name + " (" + m.size_mb + " MB)" + (m.local ? " \u2713" : "")));
  if (cfg.WHISPER_MODEL) {
    ensureOpt(sel, cfg.WHISPER_MODEL);
    sel.value = cfg.WHISPER_MODEL;
  }
  const vsel = $("cfg-TTS_VOICE");
  vsel.innerHTML = "";
  (ttsR.voices || []).forEach((v) => addOpt(vsel, v.name, v.name + (v.local ? " \u2713" : " (download needed)")));
  if (cfg.TTS_VOICE) {
    ensureOpt(vsel, cfg.TTS_VOICE);
    vsel.value = cfg.TTS_VOICE;
  }
}

function cfgEls() {
  const out = {};
  for (const el of document.querySelectorAll("[id^=cfg-]")) out[el.id.slice(4)] = el;
  return out;
}

function addOpt(sel, value, label) {
  const o = document.createElement("option");
  o.value = value; o.textContent = label;
  sel.appendChild(o);
}

function updateRange(key) {
  const el = $("cfg-" + key), lab = $("val-" + key);
  if (el && lab && el.type === "range") lab.textContent = el.value;
}
document.addEventListener("input", (ev) => {
  if (ev.target.id && ev.target.id.startsWith("cfg-")) updateRange(ev.target.id.slice(4));
});

async function loadHistoryList() {
  const body = $("histbody");
  body.innerHTML = '<div class="empty">loading...</div>';
  try {
    const d = await fetchJson("/api/chat/sessions");
    if (d.error) throw new Error(d.error);
    if (!(d.sessions || []).length) {
      body.innerHTML = '<div class="empty">No conversations yet.<br>They appear here after you talk.</div>';
      return;
    }
    body.innerHTML = "";
    d.sessions.forEach((s) => {
      const div = document.createElement("div");
      div.className = "sess";
      const when = new Date((s.mtime || 0) * 1000).toLocaleString();
      const title = document.createElement("div");
      title.className = "stitle";
      title.textContent = (s.turns || 0) + " messages - " + (s.room || "room");
      const date = document.createElement("div");
      date.className = "sdate";
      date.textContent = when;
      const prev = document.createElement("div");
      prev.className = "sprev";
      prev.textContent = s.first || "(no user text)";
      div.appendChild(title); div.appendChild(date); div.appendChild(prev);
      div.addEventListener("click", () => {
        loadHistorySession(s.file).catch((e) => toast("History error: " + e.message));
      });
      body.appendChild(div);
    });
  } catch (e) {
    body.innerHTML = "";
    const err = document.createElement("div");
    err.className = "empty";
    err.textContent = "Failed to load: " + (e && e.message ? e.message : e);
    body.appendChild(err);
  }
}

function backLink(body) {
  const span = document.createElement("span");
  span.className = "backlink";
  span.textContent = "\u2190 back to list";
  span.addEventListener("click", () => {
    loadHistoryList().catch((e) => toast("History error: " + e.message));
  });
  body.appendChild(span);
}

async function loadHistorySession(file) {
  const body = $("histbody");
  body.innerHTML = '<div class="empty">loading...</div>';
  try {
    const d = await fetchJson("/api/chat/session?file=" + encodeURIComponent(file));
    if (d.error) throw new Error(d.error);
    body.innerHTML = "";
    backLink(body);
    if (!(d.messages || []).length) {
      const none = document.createElement("div");
      none.className = "empty";
      none.textContent = "This session has no messages.";
      body.appendChild(none);
      return;
    }
    d.messages.forEach((m) => {
      const div = document.createElement("div");
      div.className = "histmsg " + (m.who === "user" ? "user" : "bot");
      const who = document.createElement("span");
      who.className = "hm-who";
      who.textContent = m.who === "user" ? "you" : "assistant";
      const ts = document.createElement("span");
      ts.className = "hm-ts";
      ts.textContent = m.ts || "";
      const txt = document.createElement("div");
      txt.className = "hm-text";
      txt.textContent = m.text;
      div.appendChild(who); div.appendChild(ts); div.appendChild(txt);
      body.appendChild(div);
    });
  } catch (e) {
    body.innerHTML = "";
    backLink(body);
    const err = document.createElement("div");
    err.className = "empty";
    err.textContent = "Failed: " + (e && e.message ? e.message : e);
    body.appendChild(err);
  }
}

checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
