# Local LiveKit server config - loopback only, no internet exposure
port: 7880
bind_addresses:
  - 127.0.0.1

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

# Every room gets the voice agent automatically (no cloud, no explicit token dispatch)
room_config:
  agents:
    - agent_name: voice-agent

# Local development keys (must match .env.local)
keys:
  devkey: voicelocal-secret-1234567890abcdef
